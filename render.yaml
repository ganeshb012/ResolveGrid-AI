services:
  - type: web
    name: resolvegrid-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    disk:
      name: resolvegrid-persistent-disk
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        value: sqlite:////var/data/data/resolvegrid.db
      - key: SECRET_KEY
        generateValue: true
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_MOCK_FALLBACK
        value: "true"
      - key: CORS_ORIGINS
        value: "https://resolvegrid.vercel.app,https://resolvegrid-ai.vercel.app"

